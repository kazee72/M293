<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>Twenty One Pilots</title>
</head>
    <body>
        <header class="navbar-header">
            <nav class="navbar">
                <a href="index.html">
                    <img class="navbar-image" src="bilder/logo5.svg" alt="logo1 top">
                </a>
            </nav>
        </header>
        <div class="grid-container">
            <a href="breach">
                <div class="grid-item breach">
                    <img src="bilder/breach.jpg" alt="breach album cover" class="grid-image">
                    <h3 class="grid-item-title">Breach</h3>
                    <p class="grid-item-year">September 2025</p>
                </div>
            </a>
            <a href="clancy">
                <div class="grid-item clancy">
                    <img src="bilder/clancy.jpg" alt="clancy album cover" class="grid-image">
                    <h3 class="grid-item-title">Clancy</h3>
                    <p class="grid-item-year">May 2024</p>
                </div>
            </a>
            <a href="sai">
                <div class="grid-item sai">
                    <img src="bilder/sai.jpg" alt="scaled and icy album cover" class="grid-image">
                    <h3 class="grid-item-title">Scaled and Icy</h3>
                    <p class="grid-item-year">May 2021</p>
                </div>
            </a>
            <a href="trench">
                <div class="grid-item trench">
                    <img src="bilder/trench.jpg" alt="trench album cover" class="grid-image">
                    <h3 class="grid-item-title">Trench</h3>
                    <p class="grid-item-year">October 2018</p>
                </div>
            </a>
            <a href="blurryface">
                <div class="grid-item blurryface">
                    <img src="bilder/blurryface.jpg" alt="blurryface album cover" class="grid-image">
                    <h3 class="grid-item-title">Blurryface</h3>
                    <p class="grid-item-year">May 2015</p>
                </div>
            </a>
            <a href="vessel">
                <div class="grid-item vessel">
                    <img src="bilder/vessel.jpg" alt="vessel album cover" class="grid-image">
                    <h3 class="grid-item-title">Vessel</h3>
                    <p class="grid-item-year">January 2013</p>
                </div>
            </a>
        </div>
    </body>
</html>
